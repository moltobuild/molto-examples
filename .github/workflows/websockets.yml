name: websockets

# libwebsockets from its tag tarball, configured by its own CMake on every
# platform: pickup installs CMake and Ninja from their upstream releases, molto
# runs the configuration and compiles the library, OpenSSL comes from the
# registry. The recipe rides along under .recipes/ until it is published.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MOLTO_REF: feat/cmake-delegate
  # pickup with moltobuild/pickup#29 (it finds an installed Ninja); a release
  # once that is in one.
  PICKUP_REF: fix/tools-at-the-top

jobs:
  linux:
    name: ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "ubuntu:26.04", "fedora:44", "archlinux:latest"]
    env:
      C_COMPILER: gcc
    steps:
      - name: Tools
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y -o Acquire::Retries=3 \
              gcc make git curl ca-certificates tar xz-utils bzip2 zstd unzip
          elif command -v dnf >/dev/null; then
            dnf install -y gcc make git curl tar xz bzip2 zstd unzip findutils diffutils
          else
            pacman -Syu --noconfirm gcc make git curl tar xz bzip2 zstd unzip diffutils
          fi
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: moltobuild/pickup
          ref: ${{ env.PICKUP_REF }}
          path: .pickup
      # What the machine already has is used as it is: pickup installs CMake
      # or Ninja only where there is none.
      - name: pickup, and CMake and Ninja where the system has none
        run: |
          make -C .pickup build CC=gcc
          install .pickup/build/pickup /usr/local/bin/pickup
          command -v cmake >/dev/null || pickup install cmake
          command -v ninja >/dev/null || pickup install ninja
          pickup tools
      - uses: actions/checkout@v4
        with:
          repository: moltobuild/molto
          ref: ${{ env.MOLTO_REF }}
          path: .molto
      - name: Build molto
        run: make -C .molto build CC=gcc
      - name: libwebsockets
        timeout-minutes: 25
        run: cd .recipes/libwebsockets/check && "$GITHUB_WORKSPACE/.molto/build/molto" run
      - name: What the configuration saw
        if: failure()
        run: |
          src=$(ls -d "$HOME"/.cache/molto/sources/libwebsockets/*/any | head -1)
          grep -nE 'OPENSSL|LWS_HAVE_EVP_MD_CTX_free|LWS_HAVE_SSL_CTX_get0' "$src/.molto-cmake/lws_config.h" | head -20
          grep -nE 'OPENSSL_(SSL|CRYPTO)_LIBRARY|OPENSSL_INCLUDE_DIR' "$src/.molto-cmake/CMakeCache.txt"
          ls -la "$HOME"/.cache/molto/platforms/openssl/*/*/usr/lib/*/ 2>/dev/null | head -20
          awk '/EVP_MD_CTX_free/{f=1} f{print; if (++n > 60) exit}' "$src/.molto-cmake/CMakeFiles/CMakeConfigureLog.yaml"

  macos:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 40
    env:
      C_COMPILER: clang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: moltobuild/pickup
          ref: ${{ env.PICKUP_REF }}
          path: .pickup
      # The runner image has CMake and Ninja of its own: they are what is used,
      # and nothing is installed.
      - name: pickup, and CMake and Ninja where the system has none
        run: |
          make -C .pickup build CC=clang
          mkdir -p "$HOME/bin" && cp .pickup/build/pickup "$HOME/bin/pickup"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          command -v cmake >/dev/null || "$HOME/bin/pickup" install cmake
          command -v ninja >/dev/null || "$HOME/bin/pickup" install ninja
          "$HOME/bin/pickup" tools
      - uses: actions/checkout@v4
        with:
          repository: moltobuild/molto
          ref: ${{ env.MOLTO_REF }}
          path: .molto
      - name: Build molto
        run: make -C .molto build CC=clang
      - name: libwebsockets
        timeout-minutes: 25
        run: cd .recipes/libwebsockets/check && "$GITHUB_WORKSPACE/.molto/build/molto" run

  windows:
    name: Windows (MinGW-w64, MSYS2)
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      C_COMPILER: gcc
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            unzip
            mingw-w64-x86_64-gcc
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: moltobuild/pickup
          ref: ${{ env.PICKUP_REF }}
          path: .pickup
      - name: pickup, and CMake and Ninja where the system has none
        run: |
          make -C .pickup build CC=gcc
          mkdir -p "$HOME/bin" && cp .pickup/build/pickup.exe "$HOME/bin/pickup.exe"
          command -v cmake >/dev/null || "$HOME/bin/pickup.exe" install cmake
          command -v ninja >/dev/null || "$HOME/bin/pickup.exe" install ninja
          "$HOME/bin/pickup.exe" tools
      - uses: actions/checkout@v4
        with:
          repository: moltobuild/molto
          ref: ${{ env.MOLTO_REF }}
          path: .molto
      - name: Build molto
        run: make -C .molto build CC=gcc
      - name: libwebsockets
        timeout-minutes: 30
        run: |
          export MOLTO_PICKUP="$HOME/bin/pickup.exe"
          cd .recipes/libwebsockets/check && "$GITHUB_WORKSPACE/.molto/build/molto.exe" run
