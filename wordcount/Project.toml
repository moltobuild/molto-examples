[package]
name = "wordcount"
version = "0.1.0"
description = "Counts lines, words and bytes, like wc"
license = "MIT"

[target]
std = "c2x"                     # C23 as compilers spell it today
requires = ["attr_nodiscard"]   # proven by pickup, not just accepted as a flag
include = ["include"]
flags = ["-Wall", "-Wextra", "-Wpedantic"]

[profile.debug]
opt_level = 0
debug_info = true

[profile.release]
opt_level = 3
debug_info = false
