[package]
name = "inventory"
version = "0.1.0"
artifact = "executable"
description = "Keeps an inventory in PostgreSQL and exports it as XML"

[target]
std = "c17"
flags = ["-Wall", "-Wextra"]

[profile.debug]
opt_level = 0
debug_info = true

[profile.release]
opt_level = 3
debug_info = false

[deps]
libpq = "18.6.0"
libxml2 = "2.15.4"
