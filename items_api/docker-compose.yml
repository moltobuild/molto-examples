services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: items
      POSTGRES_USER: items
      POSTGRES_PASSWORD: items_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/migrations/001_create_items.sql:/docker-entrypoint-initdb.d/001_create_items.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U items -d items"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
