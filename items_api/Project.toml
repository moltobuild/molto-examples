[package]
name = "items_api"
version = "0.1.0"
artifact = "executable"
description = "An items CRUD API with libwebsockets and PostgreSQL"

[target]
std = "c17"
include = ["include"]
flags = ["-Wall", "-Wextra", "-Wpedantic"]

[deps]
libwebsockets = "5.0.0"
libpq = "18.6.0"

[dev-deps]
# Both plugin releases pin this migrated runner revision. Keep one runner.
moltest = { git = "https://github.com/moltobuild/moltest", rev = "9e0611007d3b1ccebd589273dd14a7a229265c3c" }
moltest_coverage = { git = "https://github.com/moltobuild/moltest-coverage", tag = "v0.3.0" }
moltest_mock = { git = "https://github.com/moltobuild/moltest-mock", tag = "v0.5.0" }

[test]
mode = "single"

[[test.isolated]]
file = "tests/routes/test_items.c"
replaces = ["src/repositories/items.c"]

[[test.isolated]]
file = "tests/repositories/test_items.c"
replaces = ["src/db/database.c"]

[profile.debug]
opt_level = 0
debug_info = true

[profile.release]
opt_level = 3
debug_info = false
