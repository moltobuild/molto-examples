schema = 4
form = "source"
kind = "package"
name = "libwebsockets"
version = "5.0.0"
target = "any"

[source]
archive = "https://github.com/warmcat/libwebsockets/archive/refs/tags/v5.0.0.tar.gz"
sha256 = "f853c6582101cfcee3a5a9e28ae92ab19d9735c5f31f0bb2e9794b5106123962"
strip_prefix = "libwebsockets-5.0.0"

# Upstream's CMake writes .molto-cmake/lws_config.h for this machine, finding
# OpenSSL through the dependency below; molto compiles the library itself.
# OpenSSL everywhere: HTTP/3 would switch to GnuTLS and Windows to SChannel.
# No permessage-deflate (it needs zlib), no libcap, no test apps, and no
# subprocess spawning, stub IPC or system message distribution: upstream's
# Windows code for those passes an int where a HANDLE belongs, which current
# gcc refuses, and leaving them out everywhere keeps one library everywhere.
[build]
system = "cmake"
via = "delegate"
args = [
  "-DLWS_WITH_SSL=ON", "-DLWS_WITH_HTTP3=OFF", "-DLWS_WITH_SCHANNEL=OFF",
  "-DLWS_WITH_LIBCAP=OFF", "-DLWS_WITHOUT_EXTENSIONS=ON", "-DLWS_WITHOUT_TESTAPPS=ON",
  "-DLWS_WITH_MINIMAL_EXAMPLES=OFF", "-DLWS_WITH_SHARED=OFF", "-DLWS_WITH_STATIC=ON",
  "-DLWS_WITH_STUB=OFF", "-DLWS_WITH_SPAWN=OFF", "-DLWS_WITH_SYS_SMD=OFF",
]

# What CMake compiles into the static library with these options, read off its
# compile_commands.json; each platform's own files are added below.
[artifacts]
type = "source"
std = "c11"
sources = [
  "lib/core-net/adopt.c", "lib/core-net/async-ipc.c", "lib/core-net/client/client.c",
  "lib/core-net/client/conmon.c", "lib/core-net/client/connect.c",
  "lib/core-net/client/connect2.c", "lib/core-net/client/connect3.c",
  "lib/core-net/client/connect4.c", "lib/core-net/client/sort-dns.c", "lib/core-net/close.c",
  "lib/core-net/dummy-callback.c", "lib/core-net/network.c", "lib/core-net/output.c",
  "lib/core-net/pollfd.c", "lib/core-net/service.c", "lib/core-net/sorted-usec-list.c",
  "lib/core-net/state.c", "lib/core-net/txpacer.c",
  "lib/core-net/vhost.c", "lib/core-net/wol.c", "lib/core-net/wsi-timeout.c",
  "lib/core-net/wsi.c", "lib/core/adapt.c", "lib/core/alloc.c", "lib/core/buflist.c",
  "lib/core/context.c", "lib/core/libwebsockets.c", "lib/core/logs.c", "lib/core/lws_dll2.c",
  "lib/core/lws_map.c", "lib/core/vfs.c", "lib/event-libs/poll/poll.c",
  "lib/misc/base64-decode.c", "lib/misc/cache-ttl/file.c", "lib/misc/cache-ttl/heap.c",
  "lib/misc/cache-ttl/lws-cache-ttl.c", "lib/misc/dir-notify/dir-notify.c", "lib/misc/dir.c",
  "lib/misc/dlo/dlo-font-mcufont.c", "lib/misc/dlo/dlo-jpeg.c", "lib/misc/dlo/dlo-lhp.c",
  "lib/misc/dlo/dlo-png.c", "lib/misc/dlo/dlo-rect.c", "lib/misc/dlo/dlo-ss.c",
  "lib/misc/dlo/dlo-text.c", "lib/misc/dlo/dlo.c", "lib/misc/jpeg.c", "lib/misc/jrpc/jrpc.c",
  "lib/misc/lejp.c", "lib/misc/lhp-ss.c", "lib/misc/lhp.c", "lib/misc/lws-crc32.c",
  "lib/misc/lws-ring.c", "lib/misc/lwsac/cached-file.c", "lib/misc/lwsac/lwsac.c",
  "lib/misc/prng.c", "lib/misc/sha-1.c", "lib/misc/upng-gzip.c", "lib/misc/upng.c",
  "lib/roles/h1/ops-h1.c", "lib/roles/h2/hpack.c", "lib/roles/h2/http2.c",
  "lib/roles/h2/ops-h2.c", "lib/roles/http/client/client-http.c", "lib/roles/http/cookie.c",
  "lib/roles/http/date.c", "lib/roles/http/header.c", "lib/roles/http/parsers.c",
  "lib/roles/http/server/lejp-conf.c", "lib/roles/http/server/lws-spa.c",
  "lib/roles/http/server/server.c", "lib/roles/listen/ops-listen.c",
  "lib/roles/pipe/ops-pipe.c", "lib/roles/raw-file/ops-raw-file.c",
  "lib/roles/raw-skt/ops-raw-skt.c", "lib/roles/ws/client-parser-ws.c",
  "lib/roles/ws/client-ws.c", "lib/roles/ws/ops-ws.c", "lib/roles/ws/server-ws.c",
  "lib/secure-streams/policy-common.c", "lib/secure-streams/policy-json.c",
  "lib/secure-streams/protocols/ss-h1.c", "lib/secure-streams/protocols/ss-h2.c",
  "lib/secure-streams/protocols/ss-raw.c", "lib/secure-streams/protocols/ss-ws.c",
  "lib/secure-streams/secure-streams.c",
  "lib/secure-streams/system/captive-portal-detect/captive-portal-detect.c",
  "lib/secure-streams/system/fetch-policy/fetch-policy.c", "lib/system/policy.c",
  "lib/system/stdin.c", "lib/system/system.c", "lib/tls/chacha.c",
  "lib/tls/lws-genchacha.c", "lib/tls/lws-gencrypto-common.c", "lib/tls/lws-genec-common.c",
  "lib/tls/openssl/lws-genaes.c", "lib/tls/openssl/lws-gencrypto.c",
  "lib/tls/openssl/lws-genec.c", "lib/tls/openssl/lws-genhash.c",
  "lib/tls/openssl/lws-genrsa.c", "lib/tls/openssl/openssl-client.c",
  "lib/tls/openssl/openssl-server.c", "lib/tls/openssl/openssl-session.c",
  "lib/tls/openssl/openssl-ssl.c", "lib/tls/openssl/openssl-tls.c",
  "lib/tls/openssl/openssl-x509.c", "lib/tls/poly1305.c", "lib/tls/tls-client.c",
  "lib/tls/tls-network.c", "lib/tls/tls-server.c", "lib/tls/tls-sessions.c", "lib/tls/tls.c",
]
include = ["include", ".molto-cmake"]

[artifacts.private]
include = [
  "lib", "lib/core", "lib/core-net", "lib/misc", "lib/system", "lib/system/async-dns",
  "lib/system/smd", "lib/system/metrics", "lib/media", "lib/tls", "lib/event-libs",
  "lib/event-libs/poll", "lib/roles", "lib/roles/http", "lib/roles/http/compression",
  "lib/roles/h1", "lib/roles/h2", "lib/roles/ws", "lib/roles/raw-skt", "lib/roles/raw-file",
  "lib/roles/listen", "lib/secure-streams", "lib/secure-streams/serialized/client",
]
defines = ["LWS_BUILDING_STATIC"]
flags = ["-Wno-deprecated-declarations"]

[artifacts.linux]
sources = [
  # Linux monitors its routing table over netlink, as upstream configures it there.
  "lib/roles/netlink/ops-netlink.c", "lib/core-net/route.c",
  "lib/plat/unix/unix-caps.c", "lib/plat/unix/unix-fds.c", "lib/plat/unix/unix-file.c",
  "lib/plat/unix/unix-init.c", "lib/plat/unix/unix-misc.c", "lib/plat/unix/unix-pipe.c",
  "lib/plat/unix/unix-service.c", "lib/plat/unix/unix-sockets.c", 
]
link = ["pthread"]
# libwebsockets.h names siginfo_t, which glibc declares in strict ISO mode only
# when asked: every consumer's compile has to ask, not just the library's.
defines = ["_GNU_SOURCE"]

[artifacts.private.linux]
include = ["lib/plat/unix"]

[artifacts.macos]
sources = [
  "lib/plat/unix/unix-caps.c", "lib/plat/unix/unix-fds.c", "lib/plat/unix/unix-file.c",
  "lib/plat/unix/unix-init.c", "lib/plat/unix/unix-misc.c", "lib/plat/unix/unix-pipe.c",
  "lib/plat/unix/unix-service.c", "lib/plat/unix/unix-sockets.c", 
]

[artifacts.private.macos]
include = ["lib/plat/unix"]

[artifacts.windows]
sources = [
  # The gettimeofday Windows lacks, from upstream's own helpers.
  "win32port/win32helpers/gettimeofday.c",
  "lib/plat/windows/windows-fds.c", "lib/plat/windows/windows-file.c",
  "lib/plat/windows/windows-init.c", "lib/plat/windows/windows-misc.c",
  "lib/plat/windows/windows-pipe.c", "lib/plat/windows/windows-plugins.c",
  "lib/plat/windows/windows-service.c", "lib/plat/windows/windows-sockets.c",
  
]
link = ["ws2_32", "userenv", "psapi", "iphlpapi", "crypt32"]
# libwebsockets, its public headers included, tests WIN32, which a compiler in
# strict ISO mode does not predefine: without it the library takes its Unix
# branches (int sockets, no SOCKET) and a consumer sees other types than it.
defines = ["WIN32"]

[artifacts.private.windows]
include = ["lib/plat/windows", "win32port/win32helpers"]

[deps]
openssl = "3.0.13"

[about]
description = "libwebsockets 5.0.0: HTTP/1, HTTP/2 and WebSockets, client and server, over OpenSSL"
license = "MIT"
homepage = "https://libwebsockets.org"
