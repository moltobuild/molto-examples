schema = 4
form = "source"
kind = "package"
name = "libxml2"
version = "2.15.4"
target = "any"

[source]
archive = "https://download.gnome.org/sources/libxml2/2.15/libxml2-2.15.4.tar.xz"
sha256 = "98087fd181d9070724f3fbc65c7377db03038eb92bd882374daff44940138821"
strip_prefix = "libxml2-2.15.4"

# Upstream's configure writes config.h and include/libxml/xmlversion.h. zlib
# and iconv come from the recipes below, which molto compiles rather than
# configure finds, so they are switched on with defines instead of probed;
# PKG_CONFIG=true satisfies a configure that insists on pkg-config existing.
[build]
system = "autotools"
via = "delegate"
args = [
  "--without-zlib", "--without-iconv", "--without-python", "--without-readline",
  "--disable-shared", "--enable-static",
]
env = { PKG_CONFIG = "true" }

[artifacts]
type = "source"
std = "c11"
sources = [
  "buf.c", "chvalid.c", "dict.c", "encoding.c", "entities.c", "error.c",
  "globals.c", "hash.c", "list.c", "parser.c", "parserInternals.c", "SAX2.c",
  "threads.c", "tree.c", "uri.c", "valid.c", "xmlIO.c", "xmlmemory.c",
  "xmlstring.c", "c14n.c", "catalog.c", "debugXML.c", "HTMLparser.c",
  "HTMLtree.c", "xmlmodule.c", "xmlsave.c", "pattern.c", "xmlreader.c",
  "xmlregexp.c", "relaxng.c", "xmlschemas.c", "xmlschemastypes.c",
  "xmlwriter.c", "xinclude.c", "xpath.c", "xlink.c", "xpointer.c",
]
include = ["include"]
defines = ["LIBXML_STATIC", "LIBXML_ZLIB_ENABLED", "LIBXML_ICONV_ENABLED"]

[artifacts.linux]
link = ["m"]

[artifacts.macos]
link = ["m"]

# dict.c seeds its hash table from BCryptGenRandom.
[artifacts.windows]
link = ["bcrypt"]

[artifacts.private]
include = ["."]

[deps]
zlib = "1.3.1"
libiconv = { path = "../libiconv" }

[about]
description = "The XML C parser and toolkit of GNOME, with zlib and GNU libiconv"
license = "MIT"
homepage = "https://gitlab.gnome.org/GNOME/libxml2"
