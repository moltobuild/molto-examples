schema = 5
form = "source"
kind = "package"
name = "ffmpeg"
version = "9.0.2"
target = "any"

[source]
archive = "https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz"
sha256 = "8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e"
strip_prefix = "ffmpeg-9.0.2"

# Every library and every component FFmpeg builds on its own: all its decoders,
# encoders, formats, filters and protocols, its SIMD assembly (NEON in .S on
# ARM, NASM on x86) and the platform's hardware video (VideoToolbox on macOS,
# D3D11VA and DXVA2 on Windows), which configure finds in the system's SDK.
# What it would find only on some machines of one OS is turned off, so a
# platform builds the same FFmpeg everywhere: X11, ALSA, SDL, VA-API and VDPAU,
# Vulkan, CUDA, AMF, V4L2, and Metal, whose compiler only a full Xcode has.
# LGPL: nothing GPL or non-free is enabled.
[build]
system = "autotools"
via = "delegate"
args = [
  "--cc={cc}", "--cxx={cxx}", "--x86asmexe={nasm}", "--prefix=molto", "--enable-pic",
  "--disable-programs", "--disable-doc", "--disable-debug",
  "--disable-alsa", "--disable-sndio", "--disable-libxcb", "--disable-xlib", "--disable-sdl2",
  "--disable-vaapi", "--disable-vdpau", "--disable-libdrm", "--disable-vulkan",
  "--disable-metal", "--disable-cuda-llvm", "--disable-ffnvcodec", "--disable-amf",
  "--disable-v4l2-m2m",
]
# The public headers, with the two configure and make generate, under
# molto/include, where a consumer's #include <libavcodec/avcodec.h> finds them.
targets = ["install-headers"]
# zlib (PNG, compressed Matroska and FLV tracks, HTTP gzip, …), bzip2 and xz
# (compressed TIFF, Matroska and MPEG-TS tracks) and libiconv (subtitle
# character sets) come from the registry: molto builds them before configure
# runs, so its probes for -lz, -lbz2, -llzma and -liconv find them, and every
# platform gets the same ones.
libraries = { zlib = "z", bzip2 = "bz2", xz = "lzma", libiconv = "iconv" }
# What make compiles into the seven libraries.
sources = "make"
goals = [
  "libavutil/libavutil.a", "libswresample/libswresample.a", "libswscale/libswscale.a",
  "libavcodec/libavcodec.a", "libavformat/libavformat.a", "libavfilter/libavfilter.a",
  "libavdevice/libavdevice.a",
]

[artifacts]
type = "source"
# Windows' screen capture filter is C++ (WinRT), compiled with {cxx}.
cpp_std = "c++17"
include = ["molto/include"]
link = ["m"]
# Not part of any library: the program swscale runs to generate its NEON
# tables, and swscale's copy of avfilter's frame pool, which a program linking
# every library already has from avfilter.
exclude = ["libswscale/aarch64/ops_asmgen.c", "libswscale/framepool.c"]

[artifacts.linux]
link = ["pthread"]

[artifacts.macos]
link = [
  "pthread", "AudioToolbox.framework", "AVFoundation.framework", "AppKit.framework",
  "CoreAudio.framework", "CoreFoundation.framework", "CoreGraphics.framework",
  "CoreImage.framework", "CoreMedia.framework", "CoreServices.framework",
  "CoreVideo.framework", "Foundation.framework", "OpenGL.framework",
  "Security.framework", "VideoToolbox.framework",
]

[artifacts.windows]
link = [
  "bcrypt", "ole32", "user32", "gdi32", "psapi", "shlwapi", "strmiids", "uuid", "oleaut32",
  "mfuuid", "ws2_32", "secur32", "crypt32", "ncrypt", "vfw32",
]

[deps]
zlib = "1.3.1"
bzip2 = { path = "../bzip2" }
xz = { path = "../xz" }
libiconv = "1.19.0"

[about]
description = "FFmpeg 9.0.2: every codec, format, filter and device it builds on its own, with SIMD and the platform's hardware video"
license = "LGPL-2.1-or-later"
homepage = "https://ffmpeg.org"
